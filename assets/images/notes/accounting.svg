<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img" aria-labelledby="title desc">
<title id="title">자산 총액은 부채와 자본의 합과 같음</title><desc id="desc">자산 총액은 부채와 자본의 합과 같음. 개념 이해를 위한 도식이며 실제 측정값이나 통계가 아닙니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#739eb8"/></marker></defs>
<rect width="800" height="340" fill="#ffffff"/>
<g fill="none" stroke="#253239" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" font-family="Arial, 'Noto Sans', sans-serif">
<rect x="80" y="70" width="640" height="65" fill="#dbe8ef" stroke="#253239"/><text x="400" y="112" font-size="27" text-anchor="middle" fill="#253239" stroke="none">자산</text><rect x="80" y="190" width="250" height="65" fill="white" stroke="#253239"/><rect x="330" y="190" width="390" height="65" fill="#dbe8ef" stroke="#253239"/><text x="205" y="232" font-size="27" text-anchor="middle" fill="#253239" stroke="none">부채</text><text x="525" y="232" font-size="27" text-anchor="middle" fill="#253239" stroke="none">자본</text><line x1="80" y1="155" x2="720" y2="155" stroke="#a9b5bd" stroke-width="1" stroke-dasharray="4 4"/><text x="400" y="315" font-size="24" text-anchor="middle" fill="#253239" stroke="none">자산 = 부채 + 자본</text>
</g></svg>
