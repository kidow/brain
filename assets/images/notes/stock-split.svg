<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img" aria-labelledby="title desc">
<title id="title">1주를 10주로 나누어도 분할 직전의 총가치는 동일</title><desc id="desc">1주를 10주로 나누어도 분할 직전의 총가치는 동일. 개념 이해를 위한 도식이며 실제 측정값이나 통계가 아닙니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#739eb8"/></marker></defs>
<rect width="800" height="340" fill="#ffffff"/>
<g fill="none" stroke="#253239" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" font-family="Arial, 'Noto Sans', sans-serif">
<rect x="75" y="95" width="165" height="165" fill="#dbe8ef" stroke="#253239"/><text x="158" y="185" font-size="27" text-anchor="middle" fill="#253239" stroke="none">1주</text><text x="158" y="310" font-size="22" text-anchor="middle" fill="#253239" stroke="none">1,200</text><path d="M275 175 L370 175" stroke="#739eb8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="420" y="95" width="48" height="72" fill="#dbe8ef" stroke="#253239"/><text x="444" y="140" font-size="15" text-anchor="middle" fill="#253239" stroke="none">1주</text><rect x="478" y="95" width="48" height="72" fill="#dbe8ef" stroke="#253239"/><text x="502" y="140" font-size="15" text-anchor="middle" fill="#253239" stroke="none">1주</text><rect x="536" y="95" width="48" height="72" fill="#dbe8ef" stroke="#253239"/><text x="560" y="140" font-size="15" text-anchor="middle" fill="#253239" stroke="none">1주</text><rect x="594" y="95" width="48" height="72" fill="#dbe8ef" stroke="#253239"/><text x="618" y="140" font-size="15" text-anchor="middle" fill="#253239" stroke="none">1주</text><rect x="652" y="95" width="48" height="72" fill="#dbe8ef" stroke="#253239"/><text x="676" y="140" font-size="15" text-anchor="middle" fill="#253239" stroke="none">1주</text><rect x="420" y="181" width="48" height="72" fill="#dbe8ef" stroke="#253239"/><text x="444" y="226" font-size="15" text-anchor="middle" fill="#253239" stroke="none">1주</text><rect x="478" y="181" width="48" height="72" fill="#dbe8ef" stroke="#253239"/><text x="502" y="226" font-size="15" text-anchor="middle" fill="#253239" stroke="none">1주</text><rect x="536" y="181" width="48" height="72" fill="#dbe8ef" stroke="#253239"/><text x="560" y="226" font-size="15" text-anchor="middle" fill="#253239" stroke="none">1주</text><rect x="594" y="181" width="48" height="72" fill="#dbe8ef" stroke="#253239"/><text x="618" y="226" font-size="15" text-anchor="middle" fill="#253239" stroke="none">1주</text><rect x="652" y="181" width="48" height="72" fill="#dbe8ef" stroke="#253239"/><text x="676" y="226" font-size="15" text-anchor="middle" fill="#253239" stroke="none">1주</text><text x="560" y="310" font-size="22" text-anchor="middle" fill="#253239" stroke="none">120 × 10 = 1,200</text>
