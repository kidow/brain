<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img" aria-labelledby="title desc">
<title id="title">건폐율은 대지 대비 바닥면적, 용적률은 층별 면적의 합</title><desc id="desc">건폐율은 대지 대비 바닥면적, 용적률은 층별 면적의 합. 개념 이해를 위한 도식이며 실제 측정값이나 통계가 아닙니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#739eb8"/></marker></defs>
<rect width="800" height="340" fill="#ffffff"/>
<g fill="none" stroke="#253239" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" font-family="Arial, 'Noto Sans', sans-serif">
<rect x="60" y="85" width="280" height="175" fill="white" stroke="#253239"/><rect x="60" y="85" width="140" height="175" fill="#dbe8ef" stroke="#253239"/><text x="205" y="305" font-size="21" text-anchor="middle" fill="#253239" stroke="none">대지 100 · 바닥 50</text><rect x="490" y="75" width="200" height="50" fill="#dbe8ef" stroke="#253239"/><rect x="490" y="135" width="200" height="50" fill="#dbe8ef" stroke="#253239"/><rect x="490" y="195" width="200" height="50" fill="#dbe8ef" stroke="#253239"/><text x="590" y="285" font-size="21" text-anchor="middle" fill="#253239" stroke="none">50 + 50 + 50 = 150</text><text x="200" y="40" font-size="24" text-anchor="middle" fill="#253239" stroke="none">건폐율 50%</text><text x="590" y="40" font-size="24" text-anchor="middle" fill="#253239" stroke="none">용적률 150%</text>
</g></svg>
