<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img" aria-labelledby="title desc">
<title id="title">과거에 진행되던 배경과 그 안의 사건</title><desc id="desc">과거에 진행되던 배경과 그 안의 사건. 본문 내용을 설명하는 도식이며 실제 통계나 축척을 나타내지 않습니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#739eb8"/></marker></defs>
<rect width="800" height="340" fill="#ffffff"/>
<g fill="none" stroke="#253239" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" font-family="Arial, 'Noto Sans', sans-serif">
<line x1="70" y1="235" x2="745" y2="235" stroke="#253239" stroke-width="2"/><path d="M710 235 L748 235" stroke="#739eb8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><line x1="120" y1="150" x2="510" y2="150" stroke="#739eb8" stroke-width="13"/><circle cx="330" cy="150" r="10" fill="white" stroke="#253239"/><line x1="330" y1="175" x2="330" y2="228" stroke="#253239" stroke-width="2"/><text x="330" y="80" font-size="22" text-anchor="middle" fill="#253239" stroke="none">진행 중이던 배경</text><text x="330" y="280" font-size="22" text-anchor="middle" fill="#253239" stroke="none">끼어든 사건</text><line x1="680" y1="90" x2="680" y2="240" stroke="#87939b" stroke-width="2" stroke-dasharray="5 5"/><text x="680" y="280" font-size="20" text-anchor="middle" fill="#253239" stroke="none">지금</text>
</g></svg>
