<title id="title">HDD는 회전하는 디스크, SSD는 반도체 메모리로 저장</title><desc id="desc">HDD는 회전하는 디스크, SSD는 반도체 메모리로 저장. 개념 이해를 위한 도식이며 실제 측정값이나 통계가 아닙니다.</desc>
