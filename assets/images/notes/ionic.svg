<circle cx="145" cy="130" r="45" fill="white" stroke="#253239"/><text x="145" y="140" font-size="30" text-anchor="middle" fill="#253239" stroke="none">Na</text><circle cx="199" cy="130" r="5" fill="#739eb8" stroke="#253239"/><circle cx="370" cy="130" r="45" fill="white" stroke="#253239"/><text x="370" y="140" font-size="30" text-anchor="middle" fill="#253239" stroke="none">Cl</text><circle cx="325" cy="100" r="4" fill="#739eb8" stroke="#253239"/><circle cx="325" cy="160" r="4" fill="#739eb8" stroke="#253239"/><circle cx="370" cy="75" r="4" fill="#739eb8" stroke="#253239"/><circle cx="382" cy="75" r="4" fill="#739eb8" stroke="#253239"/><circle cx="370" cy="185" r="4" fill="#739eb8" stroke="#253239"/><circle cx="382" cy="185" r="4" fill="#739eb8" stroke="#253239"/><circle cx="425" cy="130" r="4" fill="#739eb8" stroke="#253239"/><path d="M210 70 L340 70" stroke="#739eb8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="275" y="45" font-size="19" text-anchor="middle" fill="#253239" stroke="none">전자 1개</text><path d="M460 130 L535 130" stroke="#739eb8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="590" y="140" font-size="30" text-anchor="middle" fill="#253239" stroke="none">Na⁺</text><text x="710" y="140" font-size="30" text-anchor="middle" fill="#253239" stroke="none">Cl⁻</text><text x="650" y="245" font-size="23" text-anchor="middle" fill="#253239" stroke="none">전자를 주고받음</text>
