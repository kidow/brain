<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img" aria-labelledby="title desc">
<title id="title">기온이라는 공통 원인이 두 현상에 각각 영향을 주는 구조</title><desc id="desc">기온이라는 공통 원인이 두 현상에 각각 영향을 주는 구조. 개념 이해를 위한 도식이며 실제 측정값이나 통계가 아닙니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#739eb8"/></marker></defs>
<rect width="800" height="340" fill="#ffffff"/>
<g fill="none" stroke="#253239" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" font-family="Arial, 'Noto Sans', sans-serif">
<rect x="345" y="30" width="110" height="55" fill="#dbe8ef" stroke="#253239"/><text x="400" y="65" font-size="23" text-anchor="middle" fill="#253239" stroke="none">기온</text><path d="M350 90 L215 175" stroke="#739eb8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M450 90 L585 175" stroke="#739eb8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M165 190 L215 190 L195 265 Z" stroke="#253239" stroke-width="2" fill="#dbe8ef" /><circle cx="190" cy="185" r="25" fill="white" stroke="#253239"/><path d="M565 250 Q580 235 595 250 T625 250 T655 250" stroke="#739eb8" stroke-width="3" fill="none" /><circle cx="615" cy="210" r="10" fill="white" stroke="#253239"/><line x1="605" y1="230" x2="640" y2="220" stroke="#253239" stroke-width="2"/><text x="190" y="305" font-size="21" text-anchor="middle" fill="#253239" stroke="none">아이스크림 판매</text><text x="615" y="305" font-size="21" text-anchor="middle" fill="#253239" stroke="none">물놀이 사고</text><line x1="270" y1="225" x2="535" y2="225" stroke="#aeb7bd" stroke-width="2" stroke-dasharray="5 6"/><text x="400" y="258" font-size="18" text-anchor="middle" fill="#253239" stroke="none">함께 늘어도 원인·결과는 아님</text>
</g></svg>
