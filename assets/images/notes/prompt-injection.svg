<svg xmlns="http://www.w3.org/2000/svg" width="800" height="355" viewBox="0 0 800 355" role="img" aria-labelledby="title desc">
<title id="title">참고 문서의 내용을 지시로 오인하는 간접 프롬프트 주입</title><desc id="desc">참고 문서의 내용을 지시로 오인하는 간접 프롬프트 주입. 개념 이해를 위한 도식이며 실제 측정값이나 통계가 아닙니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#739eb8"/></marker></defs>
<rect width="800" height="355" fill="#ffffff"/>
<g fill="none" stroke="#253239" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" font-family="Arial, 'Noto Sans', sans-serif">
<rect x="50" y="60" width="95" height="70" fill="white" stroke="#253239"/><line x1="50" y1="77" x2="145" y2="77" stroke="#253239" stroke-width="2"/><circle cx="62" cy="68" r="2" fill="#739eb8" stroke="#739eb8"/><circle cx="73" cy="68" r="2" fill="#739eb8" stroke="#739eb8"/><circle cx="84" cy="68" r="2" fill="#739eb8" stroke="#739eb8"/><text x="98" y="160" font-size="17" text-anchor="middle" fill="#253239" stroke="none">사용자 요청</text><rect x="65" y="210" width="90" height="75" fill="white" stroke="#253239"/><line x1="80" y1="225" x2="135" y2="225" stroke="#253239" stroke-width="2"/><line x1="80" y1="242" x2="140" y2="242" stroke="#739eb8" stroke-width="5"/><line x1="80" y1="260" x2="135" y2="260" stroke="#253239" stroke-width="2"/><text x="110" y="325" font-size="19" text-anchor="middle" fill="#253239" stroke="none">외부 문서</text><path d="M165 95 L365 130" stroke="#739eb8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M170 245 H270 V165 H365" stroke="#739eb8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="380" y="100" width="135" height="90" fill="#dbe8ef" stroke="#253239"/><text x="447" y="153" font-size="28" text-anchor="middle" fill="#253239" stroke="none">AI</text><path d="M535 145 L640 145" stroke="#739eb8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="665" y="105" width="75" height="85" fill="white" stroke="#253239"/><text x="700" y="235" font-size="19" text-anchor="middle" fill="#253239" stroke="none">출력·행동</text><text x="275" y="290" font-size="20" text-anchor="middle" fill="#253239" stroke="none">내용 ≠ 지시</text>
