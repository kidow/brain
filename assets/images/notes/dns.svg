<svg xmlns="http://www.w3.org/2000/svg" width="800" height="355" viewBox="0 0 800 355" role="img" aria-labelledby="title desc">
<title id="title">DNS로 주소를 확인한 뒤 웹 서버에 직접 접속</title><desc id="desc">DNS로 주소를 확인한 뒤 웹 서버에 직접 접속. 개념 이해를 위한 도식이며 실제 측정값이나 통계가 아닙니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#739eb8"/></marker></defs>
<rect width="800" height="355" fill="#ffffff"/>
<g fill="none" stroke="#253239" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" font-family="Arial, 'Noto Sans', sans-serif">
<rect x="65" y="140" width="95" height="70" fill="white" stroke="#253239"/><line x1="65" y1="157" x2="160" y2="157" stroke="#253239" stroke-width="2"/><circle cx="77" cy="148" r="2" fill="#739eb8" stroke="#739eb8"/><circle cx="88" cy="148" r="2" fill="#739eb8" stroke="#739eb8"/><circle cx="99" cy="148" r="2" fill="#739eb8" stroke="#739eb8"/><text x="113" y="240" font-size="17" text-anchor="middle" fill="#253239" stroke="none">브라우저</text><rect x="365" y="55" width="70" height="80" fill="white" stroke="#253239"/><rect x="373" y="67" width="54" height="14" fill="#e8ecee" stroke="#253239"/><circle cx="381" cy="74" r="2" fill="#739eb8" stroke="#739eb8"/><rect x="373" y="90" width="54" height="14" fill="#e8ecee" stroke="#253239"/><circle cx="381" cy="97" r="2" fill="#739eb8" stroke="#739eb8"/><rect x="373" y="113" width="54" height="14" fill="#e8ecee" stroke="#253239"/><circle cx="381" cy="120" r="2" fill="#739eb8" stroke="#739eb8"/><text x="400" y="165" font-size="17" text-anchor="middle" fill="#253239" stroke="none">DNS</text><rect x="650" y="195" width="70" height="80" fill="white" stroke="#253239"/><rect x="658" y="207" width="54" height="14" fill="#e8ecee" stroke="#253239"/><circle cx="666" cy="214" r="2" fill="#739eb8" stroke="#739eb8"/><rect x="658" y="230" width="54" height="14" fill="#e8ecee" stroke="#253239"/><circle cx="666" cy="237" r="2" fill="#739eb8" stroke="#739eb8"/><rect x="658" y="253" width="54" height="14" fill="#e8ecee" stroke="#253239"/><circle cx="666" cy="260" r="2" fill="#739eb8" stroke="#739eb8"/><text x="685" y="305" font-size="17" text-anchor="middle" fill="#253239" stroke="none">웹 서버</text><path d="M175 155 L350 90" stroke="#739eb8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M360 115 L190 180" stroke="#739eb8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="225" y="100" font-size="18" text-anchor="middle" fill="#253239" stroke="none">이름 조회</text><text x="270" y="215" font-size="18" text-anchor="middle" fill="#253239" stroke="none">IP 응답</text><path d="M180 235 L630 235" stroke="#739eb8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="410" y="280" font-size="20" text-anchor="middle" fill="#253239" stroke="none">IP로 접속</text>
