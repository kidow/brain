<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
<title id="title">누진세는 구간별로 나눠 각각의 세율을 적용</title><desc id="desc">누진세는 구간별로 나눠 각각의 세율을 적용. 개념 이해를 위한 도식이며 실제 측정값이나 통계가 아닙니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#739eb8"/></marker></defs>
<rect width="800" height="360" fill="#ffffff"/>
<g fill="none" stroke="#253239" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" font-family="Arial, 'Noto Sans', sans-serif">
<line x1="90" y1="240" x2="730" y2="240" stroke="#253239" stroke-width="2"/><rect x="100" y="150" width="200" height="90" fill="white" stroke="#253239"/><text x="200" y="285" font-size="20" text-anchor="middle" fill="#253239" stroke="none">1구간</text><rect x="300" y="115" width="200" height="125" fill="#dbe8ef" stroke="#253239"/><text x="400" y="285" font-size="20" text-anchor="middle" fill="#253239" stroke="none">2구간</text><rect x="500" y="80" width="200" height="160" fill="#739eb8" stroke="#253239"/><text x="600" y="285" font-size="20" text-anchor="middle" fill="#253239" stroke="none">3구간</text><text x="400" y="65" font-size="23" text-anchor="middle" fill="#253239" stroke="none">각 소득 구간에 해당 세율 적용</text><text x="400" y="330" font-size="18" text-anchor="middle" fill="#253239" stroke="none">실제 구간·세율이 아닌 구조 설명</text>
</g></svg>
