<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img" aria-labelledby="title desc">
<title id="title">같은 키의 재요청은 한 번의 결제 결과를 공유</title><desc id="desc">같은 키의 재요청은 한 번의 결제 결과를 공유. 개념 이해를 위한 도식이며 실제 측정값이나 통계가 아닙니다.</desc>
