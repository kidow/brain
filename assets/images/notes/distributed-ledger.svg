<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img" aria-labelledby="title desc">
<title id="title">장부 한 곳을 관리자가 쥐는 구조와 모두가 사본을 갖는 구조</title><desc id="desc">왼쪽은 은행 한 곳이 장부를 갖고 사용자가 모두 그곳을 거치는 구조, 오른쪽은 참여자 모두가 같은 장부 사본을 갖고 거래를 서로 전달하는 분산 원장. 개념 이해를 위한 도식이며 실제 측정값이나 통계가 아닙니다.</desc>
