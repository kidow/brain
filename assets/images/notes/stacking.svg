<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img" aria-labelledby="title desc">
<title id="title">자식의 z-index는 부모 stacking context를 벗어나지 못함</title><desc id="desc">자식의 z-index는 부모 stacking context를 벗어나지 못함. 개념 이해를 위한 도식이며 실제 측정값이나 통계가 아닙니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#739eb8"/></marker></defs>
<rect width="800" height="340" fill="#ffffff"/>
<g fill="none" stroke="#253239" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" font-family="Arial, 'Noto Sans', sans-serif">
<rect x="65" y="70" width="385" height="205" fill="#e8ecee" stroke="#253239"/><text x="175" y="105" font-size="22" text-anchor="middle" fill="#253239" stroke="none">부모 z = 1</text><rect x="230" y="135" width="175" height="100" fill="#dbe8ef" stroke="#253239"/><text x="315" y="195" font-size="18" text-anchor="middle" fill="#253239" stroke="none">자식 z = 9999</text><rect x="370" y="110" width="345" height="145" fill="white" stroke="#253239"/><text x="555" y="195" font-size="22" text-anchor="middle" fill="#253239" stroke="none">다른 부모 z = 2</text><line x1="370" y1="110" x2="370" y2="255" stroke="#739eb8" stroke-width="4"/>
</g></svg>
